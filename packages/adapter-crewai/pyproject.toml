[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quokka-crewai"
version = "0.1.0"
description = "CrewAI adapter for Quokka browser automation via MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "crewai>=0.80.0",
  "mcp>=1.0.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/quokka_crewai"]
