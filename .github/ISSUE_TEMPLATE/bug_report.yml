name: Bug Report
description: Report a bug or unexpected behavior in Quokka
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please fill in the details below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Run recipe '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages or console output if available.
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      description: "Find this at chrome://version"
      placeholder: "e.g. 124.0.6367.91"
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Quokka extension version
      description: "Find this at chrome://extensions"
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 15.1, Windows 11, Ubuntu 24.04"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, console logs, recipe JSON, or anything else that might help.
    validations:
      required: false
